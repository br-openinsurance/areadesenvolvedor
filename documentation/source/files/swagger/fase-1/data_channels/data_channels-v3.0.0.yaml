openapi: 3.0.0
info:
  title: APIs Open Data do Open Insurance Brasil
  description: As APIs descritas neste documento são referentes as APIs da fase Open Data do Open Insurance Brasil.
  version: 3.0.0
  contact:
    url: 'https://www.gov.br/susep/'
tags:
  - name: "Channels"
    description: "Operações para listagem de canais de atendimentos"
servers:
  - url: http://api.organizacao.com.br/open-insurance/channels/v3
paths:
  /branches:
    get:
      tags:
        - "Channels"
      summary: Obtém a listagem de dependências próprias da instituição.
      description: "Método para obter a listagem de dependências próprias da instituição."
      operationId: "getBranches"
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        '200':
          description: Lista de dependências próprias obtida com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseBranchesList'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          description: Lista de dependências próprias obtida com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseBranchesList'     
  /electronic-channels:
    get:
      tags:
        - "Channels"
      summary: Obtém a listagem de canais eletrônicos de atendimento da instituição.
      description: "Método para obter a listagem de canais eletrônicos de atendimento da instituição."
      operationId: "getElectronicChannels"
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        '200':
          description: Listagem de canais eletrônicos de atendimento obtida com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseElectronicChannelsList'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          description: Listagem de canais eletrônicos de atendimento obtida com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseElectronicChannelsList'  
  /phone-channels:
    get:
      tags:
        - "Channels"
      summary: "Obtém a listagem de canais telefônicos de atendimento da instituição."
      description: "Método para obter a listagem de canais telefônicos de atendimento da instituição."
      operationId: "getPhoneChannels"
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        '200':
          description: Listagem de canais telefônicos de atendimento obtida com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsePhoneChannelsList'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          description: Listagem de canais telefônicos de atendimento obtida com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsePhoneChannelsList'
components:
  schemas:
    ResponseBranchesList:
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: object
          required:
            - brand
          properties:
            brand:
              $ref: '#/components/schemas/BranchesBrand'
        links:
          $ref: '#/components/schemas/Links'
        meta:
          $ref: '#/components/schemas/Meta'

    BranchesBrand:
      type: object
      required:
        - name
        - companies
      properties:
        name:
          type: string
          description: Nome da marca reportada pelo participante do Open Insurance. O conceito a que se refere a marca é em essência uma promessa das sociedades sob ela em fornecer uma série específica de atributos, benefícios e serviços uniformes aos clientes.
          maxLength: 80
          pattern: \w*\W*
          example: Organização AZ
        companies:
          type: array
          items:
            $ref: '#/components/schemas/BranchesCompany'
          minItems: 1
          description: Companies traz uma lista de todas as instituições da Marca.

    BranchesCompany:
      type: object
      required:
        - name
        - cnpjNumber
        - branches
      properties:
        name:
          type: string
          maxLength: 80
          pattern: \w*\W*
          example: Empresa A1
        cnpjNumber:
          type: string
          description: |
            Número completo do CNPJ da instituição responsável pela dependência - o CNPJ corresponde ao número de inscrição no Cadastro de Pessoa Jurídica.
            Deve-se ter apenas os números do CNPJ, sem máscara
          pattern: '^[A-Z0-9]{12}\d{2}$'
          example: '12345678901234'
        branches:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
          minItems: 1
          description: Lista de Dependências de uma Instituição

    ResponseElectronicChannelsList:
      description: Listagem de canais eletrônicos de atendimento obtida com sucesso.
      type: object
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: object
          required:
            - brand
          properties:
            brand:
              $ref: '#/components/schemas/ElectronicChannelsBrand'
        links:
          $ref: '#/components/schemas/Links'
        meta:
          $ref: '#/components/schemas/Meta'      

    ElectronicChannelsBrand:
      type: object
      required:
        - name
        - companies
      properties:
        name:
          type: string
          description: Nome da sociedade responsável pelo canal eletrônico.
          example: "Marca A"
          maxLength: 80
          pattern: \w*\W*
        companies:
          type: array
          items:
            $ref: '#/components/schemas/ElectronicChannelsCompanies'
          minItems: 1
          description: Lista de instituições pertencentes à marca

    ElectronicChannelsCompanies:
      type: object
      required:
        - name
        - electronicChannels
        - cnpjNumber
      properties:
        name:
          type: string
          description: Nome da marca selecionada pela Organização proprietária da dependência (titular).
          example: "Empresa da Marca A"
          maxLength: 80
          pattern: \w*\W*
        cnpjNumber:
          type: string
          description: CNPJ da sociedade responsável pelo canal eletrônico.
          pattern: '^[A-Z0-9]{12}\d{2}$'
          example: '12345678901234'
        electronicChannels:
          type: array
          items:
            $ref: '#/components/schemas/ElectronicChannels'
          minItems: 1
          maxItems: 99
          description: Lista  de canais de atendimento eletrônico

    Branch:
      type: object
      description: Dependência destinada à prática das atividades para as quais a instituição esteja regularmente habilitada.
      required:
        - identification
        - postalAddress
        - availability
        - services
      properties:
        identification:
          $ref: '#/components/schemas/BranchIdentification'
        postalAddress:
          $ref: '#/components/schemas/BranchPostalAddress'
        availability:
          $ref: '#/components/schemas/BranchAvailability'
        phones:
          type: array
          items:
            $ref: '#/components/schemas/BranchPhone'
          minItems: 1
          description: Listagem de telefones da Dependência própria
        services:
          type: array
          description: Traz a relação de serviços disponibilizados pelo Canal de Atendimento
          items:
            $ref: '#/components/schemas/BranchService'
          minItems: 1
          maxItems: 20

    BranchPostalAddress:
      type: object
      required:
        - address
      properties:
        address:
          $ref: '#/components/schemas/Address'
        geographicCoordinates:
          $ref: '#/components/schemas/BranchesGeographicCoordinates'       
    Address:
      type: object
      description: 'dados do endereço'
      required:
        - flagPostCode
        - address
      properties:
        flagPostCode:
          type: string
          description: Indica se o endereço será nacional ou internacional
          enum:
            - NACIONAL
            - INTERNACIONAL
        address:
          description: endereço completo
          oneOf:
            - $ref: '#/components/schemas/NationalAddress'
            - $ref: '#/components/schemas/InternationalAddress'
    InternationalAddress:
      type: object
      required:
        - type
        - name
        - number
        - townName
        - countrySubDivision
        - postCode
        - countryCode
      properties:
        type: 
          type: string
          description: 'Tipo do logradouro'
          enum: [AEROPORTO, ALAMEDA, AREA, AVENIDA, CAMPO, CHACARA, COLONIA, CONDOMINIO, CONJUNTO, DISTRITO, ESPLANADA, ESTACAO, ESTRADA, FAZENDA, FEIRA, JARDIM, LADEIRA, LAGO, LAGOA, LARGO, LOTEAMENTO, NUCLEO, PARQUE, PASSARELA, PATIO, PRACA, QUADRA, RECANTO, RESIDENCIAL, RODOVIA, RUA, SETOR, SITIO, TRAVESSA, TRECHO, TREVO, VALE, VEREDA, VIA, VIADUTO, VIELA, VILA, OUTROS]
        typeOthers: 
          type: string
          description: Descrição do tipo do logradouro. Condicional ao preenchimento do campo "type" com valor OUTROS
          maxLength: 30
        name: 
          type: string
          description: 'Nome do logradouro'
          maxLength: 100
        number:
          type: string
          description: 'Número do logradouro'
          pattern: '^[0-9A-Za-zÀ-ÿ\s\/\-\.,ºª]{1,40}$'
        addressComplementaryInfo:
          type: string
          maxLength: 50
          example: Fundos
          description: 'Alguns logradouros ainda necessitam ser especificados por meio de complemento.'
        districtName:
          type: string
          maxLength: 70
          example: 'Centro'
          description: 'Bairro é uma comunidade ou região localizada em uma cidade ou município de acordo com as suas subdivisões geográficas'
        townName:
          type: string
          maxLength: 50
          pattern: '^[0-9A-Za-zÀ-ÿ\s\/\-\.,ºª]+$'
          example: Marília
          description: |
                  Designação da cidade ou município no qual o endereço está localizado.
        countrySubDivision:
          type: string
          maxLength: 50
          pattern: '^[0-9A-Za-zÀ-ÿ\s\/\-\.,ºª]+$'
          example: New York
          description: |
                  Designação do estado, província, região ou cantão no qual o endereço está localizado.
        postCode:
          type: string
          maxLength: 11
          example: '17500001A'
          description: |
                  Código de Endereçamento Postal: Composto por um conjunto numérico ou alfanumérico.
        countryCode:
          $ref: '#/components/schemas/EnumCountryCode'  
    NationalAddress:
      type: object
      required:
        - type
        - name
        - number
        - townName
        - countrySubDivision
        - postCode
      properties:
        type: 
          type: string
          description: 'Tipo do logradouro'
          enum: [AEROPORTO, ALAMEDA, AREA, AVENIDA, CAMPO, CHACARA, COLONIA, CONDOMINIO, CONJUNTO, DISTRITO, ESPLANADA, ESTACAO, ESTRADA, FAZENDA, FEIRA, JARDIM, LADEIRA, LAGO, LAGOA, LARGO, LOTEAMENTO, NUCLEO, PARQUE, PASSARELA, PATIO, PRACA, QUADRA, RECANTO, RESIDENCIAL, RODOVIA, RUA, SETOR, SITIO, TRAVESSA, TRECHO, TREVO, VALE, VEREDA, VIA, VIADUTO, VIELA, VILA, OUTROS]
        typeOthers: 
          type: string
          description: Descrição do tipo do logradouro. Condicional ao preenchimento do campo "type" com valor OUTROS
          maxLength: 30
        name: 
          type: string
          maxLength: 100
          description: 'Nome do logradouro'
        number:
          type: string
          description: 'Número do logradouro'
          pattern: '^[0-9A-Za-zÀ-ÿ\s\/\-\.,ºª]{1,40}$'
        addressComplementaryInfo:
          type: string
          maxLength: 50
          example: Fundos
          description: 'Alguns logradouros ainda necessitam ser especificados por meio de complemento.'
        districtName:
          type: string
          maxLength: 70
          example: 'Centro'
          description: 'Bairro é uma comunidade ou região localizada em uma cidade ou município de acordo com as suas subdivisões geográficas'
        townName:
          type: string
          maxLength: 50
          pattern: '^[0-9A-Za-zÀ-ÿ\s\/\-\.,ºª]+$'
          example: Marília
          description: |
                  Localidade: O nome da localidade corresponde à designação da cidade ou município no qual o endereço está localizado.
        ibgeTownCode:
          type: string
          pattern: '^\d{7}$|^NA$'
          maxLength: 7
          example: "1750000"
          description: |
            Código IBGE do município
        countrySubDivision:
          $ref: '#/components/schemas/EnumCountrySubDivision'
        postCode:
          type: string
          pattern: '^\d{8}$|^NA$'
          maxLength: 8
          example: '17500001'
          description: |
                  Código de Endereçamento Postal: Composto por um conjunto numérico de oito dígitos, o objetivo principal do CEP é orientar e acelerar o encaminhamento, o tratamento e a entrega de objetos postados nos Correios, por meio da sua atribuição a localidades, logradouros, unidades dos Correios, serviços, órgãos públicos, empresas e edifícios. p.ex. '01311000'. Condicional ao preenchimento do FlagPostCode ser igual a "Nacional".
    EnumCountrySubDivision:
      type: string
      description: "Enumeração referente a cada sigla da unidade da federação que identifica o estado ou o distrito federal, no qual o endereço está localizado. p.ex. 'AC'. São consideradas apenas as siglas para os estados brasileiros"
      enum:
        - AC
        - AL
        - AP
        - AM
        - BA
        - CE
        - DF
        - ES
        - GO
        - MA
        - MT
        - MS
        - MG
        - PA
        - PB
        - PR
        - PE
        - PI
        - RJ
        - RN
        - RS
        - RO
        - RR
        - SC
        - SP
        - SE
        - TO
      example: RJ
    EnumCountryCode:
      description: Nome do país (de acordo com o código "alpha3" do ISO-3166)
      type: string
      enum: [AFG,ALA,ALB,DZA,ASM,AND,AGO,AIA,ATA,ATG,ARG,ARM,ABW,AUS,AUT,AZE,BHS,BHR,BGD,BRB,BLR,BEL,BLZ,BEN,BMU,BTN,BOL,BES,BIH,BWA,BVT,BRA,IOT,BRN,BGR,BFA,BDI,CPV,KHM,CMR,CAN,CYM,CAF,TCD,CHL,CHN,CXR,CCK,COL,COM,COG,COD,COK,CRI,CIV,HRV,CUB,CUW,CYP,CZE,DNK,DJI,DMA,DOM,ECU,EGY,SLV,GNQ,ERI,EST,SWZ,ETH,FLK,FRO,FJI,FIN,FRA,GUF,PYF,ATF,GAB,GMB,GEO,DEU,GHA,GIB,GRC,GRL,GRD,GLP,GUM,GTM,GGY,GIN,GNB,GUY,HTI,HMD,VAT,HND,HKG,HUN,ISL,IND,IDN,IRN,IRQ,IRL,IMN,ISR,ITA,JAM,JPN,JEY,JOR,KAZ,KEN,KIR,PRK,KOR,KWT,KGZ,LAO,LVA,LBN,LSO,LBR,LBY,LIE,LTU, LUX,MAC,MDG,MWI,MYS,MDV,MLI,MLT,MHL,MTQ,MRT,MUS,MYT,MEX,FSM,MDA,MCO,MNG,MNE,MSR,MAR,MOZ,MMR,NAM,NRU,NPL,NLD,NCL,NZL,NIC,NER,NGA,NIU,NFK,MKD,MNP,NOR,OMN,PAK,PLW,PSE,PAN,PNG,PRY,PER,PHL,PCN,POL,PRT,PRI,QAT,REU,ROU,RUS,RWA,BLM,SHN,KNA,LCA,MAF,SPM,VCT,WSM,SMR,STP,SAU,SEN,SRB,SYC,SLE,SGP,SXM,SVK,SVN,SLB,SOM,ZAF,SGS,SSD,ESP,LKA,SDN,SUR,SJM,SWE,CHE,SYR,TWN,TJK,TZA,THA,TLS,TGO,TKL,TON,TTO,TUN,TUR,TKM,TCA,TUV,UGA,UKR,ARE,GBR,USA,UMI,URY,UZB,VUT,VEN,VNM,VGB,VIR,WLF,ESH,YEM,ZMB,ZWE]
      example: BRA
    BranchIdentification:
      type: object
      properties:
        type:
          type: string
          description: Tipo de dependência.
          enum: ['FILIAL','UNIDADE_ADMINISTRATIVA_DESMEMBRADA', 'DEPENDENCIAS_DE_TERCEIROS']
          example: FILIAL
        code:
          type: string
          maxLength: 4
          pattern: '^\d{4}$'
          description: Código identificador da dependência
          example: '0001'
        checkDigit:
          type: string
          maxLength: 1
          pattern: '\d'
          description: Dígito verificador do código da dependência
          example: '9'
        name:
          type: string
          maxLength: 100
          pattern: \w*\W*
          description: Nome da dependência
          example: Dependência ABC    

    BranchAvailability:
      type: object
      properties:
        standards:
          type: array
          description: Lista disponibilidade padrão da dependência próprias por dias da semana
          items:
            type: object
            properties:
              weekday:
                type: string
                enum:
                  - DOMINGO
                  - SEGUNDA_FEIRA
                  - TERCA_FEIRA
                  - QUARTA_FEIRA
                  - QUINTA_FEIRA
                  - SEXTA_FEIRA
                  - SABADO
                description: Dia da semana de abertura da dependência
                example: SEGUNDA_FEIRA
              openingTime:
                type: string
                description: Horário de abertura da dependência (UTC)
                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$
                example: 10:00:57Z
              closingTime:
                type: string
                description: Horário de fechamento da dependência (UTC)
                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$
                example: 16:00:57Z
            required:
              - weekday
              - openingTime
              - closingTime
          minItems: 1
          maxItems: 7
        isPublicAccessAllowed:
          type: boolean
          description: Indica se a instalação da Dependência tem acesso restrito a clientes.
          example: true
      required:
        - standards

    ElectronicChannelsAvailability:
      type: object
      properties:
        standards:
          type: array
          description: Lista disponibilidade padrão da dependência próprias por dias da semana
          items:
            type: object
            properties:
              weekday:
                type: string
                enum:
                  - DOMINGO
                  - SEGUNDA_FEIRA
                  - TERCA_FEIRA
                  - QUARTA_FEIRA
                  - QUINTA_FEIRA
                  - SEXTA_FEIRA
                  - SABADO
                description: Dias de funcionamento em formato texto
                example: SEGUNDA_FEIRA
              openingTime:
                type: string
                description: Horário padrão de início de atendimento do canal eletrônico. (UTC)
                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$
                example: 10:00:57Z
              closingTime:
                type: string
                description: Horário padrão de encerramento de atendimento do canal eletrônico (UTC)
                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$
                example: 16:00:57Z
            required:
              - weekday
              - openingTime
              - closingTime
          minItems: 1
          maxItems: 7
      required:
        - standards

    PhoneChannelsAvailability:
      type: object
      properties:
        standards:
          type: array
          description: Lista disponibilidade padrão da dependência próprias por dias da semana
          items:
            type: object
            properties:
              weekday:
                type: string
                enum:
                  - DOMINGO
                  - SEGUNDA_FEIRA
                  - TERCA_FEIRA
                  - QUARTA_FEIRA
                  - QUINTA_FEIRA
                  - SEXTA_FEIRA
                  - SABADO
                description: Dia da semana de abertura da dependência
                example: SEGUNDA_FEIRA
              openingTime:
                type: string
                description: Horário de abertura da dependência (UTC)
                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$
                example: 10:00:57Z
              closingTime:
                type: string
                description: Horário de fechamento da dependência (UTC)
                pattern: ^([0-1][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$
                example: 16:00:57Z
            required:
              - weekday
              - openingTime
              - closingTime
          minItems: 1
          maxItems: 7
      required:
        - standards

    BranchService:
      type: object
      required:
      - code
      - name
      properties:
        name:
          type: string
          enum:
            - ALTERACOES_FORMA_PAGAMENTO
            - AVISO_SINISTRO
            - CANCELAMENTO_SUSPENSAO_PAGAMENTO_PREMIOS_CONTRIBUICAO
            - EFETIVACAO_APORTE
            - ENDOSSO
            - ENVIO_DOCUMENTOS
            - INFORMACOES_GERAIS_DUVIDAS
            - INFORMACOES_INTERMEDIARIOS
            - INFORMACOES_SOBRE_SERVICOS_ASSISTENCIAS
            - INFORMACOES_SOBRE_SORTEIOS
            - OUVIDORIA_RECEPCAO_SUGESTOES_ELOGIOS
            - OUVIDORIA_SOLUCAO_EVENTUAIS_DIVERGENCIAS_SOBRE_CONTRATO_SEGURO_CAPITALIZACAO_PREVIDENCIA_APOS_ESGOTADOS_CANAIS_REGULARES_ATENDIMENTO_AQUELAS_ORIUNDAS_ORGAOS_REGULADORES_OU_INTEGRANTES_SISTEMA_NACIONAL_DEFESA_CONSUMIDOR
            - OUVIDORIA_TRATAMENTO_INSATISFACAO_CONSUMIDOR_RELACAO_ATENDIMENTO_RECEBIDO_CANAIS_REGULARES_ATENDIMENTO
            - OUVIDORIA_TRATAMENTO_RECLAMACOES_SOBRE_IRREGULARIDADES_CONDUTA_COMPANHIA
            - PORTABILIDADE
            - RECLAMACAO
            - RESGATE
            - SEGUNDA_VIA_DOCUMENTOS_CONTRATUAIS
            - SUGESTOES_ELOGIOS
          description: Nome dos Serviços efetivamente prestados pelo Canal de Atendimento
          example: "ENDOSSO"
        code:
          type: string
          enum:
            - "01"
            - "02"
            - "03"
            - "04"
            - "05"
            - "06"
            - "07"
            - "08"

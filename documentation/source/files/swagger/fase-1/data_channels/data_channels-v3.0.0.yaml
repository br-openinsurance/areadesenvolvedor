            - "11"
            - "12"
            - "13"
            - "14"
            - "15"
            - "16"
            - "17"
            - "18"
            - "19"
          description: Código dos Serviços efetivamente prestados pelo Canal de Atendimento
          example: "05"

    ElectronicChannels:
      type: object
      required:
        - identification
        - services
        - availability
      properties:
        identification:
          $ref: '#/components/schemas/ElectronicChannelsIdentification'
        services:
          type: array
          items:
            $ref: '#/components/schemas/ElectronicChannelsServices'
          minItems: 1
          maxItems: 20
          description: "Traz a relação de serviços disponibilizados pelo Canal de Atendimento"
        availability:
          $ref: '#/components/schemas/ElectronicChannelsAvailability'

    ElectronicChannelsIdentification:
      type: object
      required:
        - type
        - accessType
        - urls
      properties:
        type:
          type: string
          enum:
            - INTERNET
            - MOBILE
            - CHAT
            - WHATSAPP
            - CONSUMIDOR_GOV_BR
            - OUTROS
          description: "Tipo de canal de atendimento eletrônico"

        urls:
          type: array
          items:
            $ref: '#/components/schemas/ElectronicChannelsUrl'
          minItems: 1
          description: Lista das URLs que atendem um tipo de canal eletrônico selecionado

    ElectronicChannelsUrl:
      type: string
      pattern: \w*\W*
      maxLength: 1024

    ElectronicChannelsServices:
      type: object
      required:

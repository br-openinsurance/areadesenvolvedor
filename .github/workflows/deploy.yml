name: Deploy

on:
  push:
    branches: [ 'main' ]
    paths-ignore:
      - 'documentation/source/files/swagger/**'
  workflow_run:
    workflows: [ 'Sync Swagger Pages' ]
    types: [ completed ]

concurrency:
  group: deploy-pages-${{ github.event.workflow_run.head_branch || github.ref_name || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: write

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: documentation

    env:
      ruby-version: 3.0.0

    steps:
    - uses: actions/checkout@v2
      with:
        ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ env.ruby-version }}

    - uses: actions/cache@v4
      with:
        path: vendor/bundle
        key: gems-${{ runner.os }}-${{ env.ruby-version }}-${{ hashFiles('**/Gemfile.lock') }}
        restore-keys: |
          gems-${{ runner.os }}-${{ env.ruby-version }}-
          gems-${{ runner.os }}-

    - run: bundle config set deployment 'true'
    - name: bundle install
      run: |
        bundle config path vendor/bundle
        bundle install --jobs 4 --retry 3

    - run: bundle exec middleman build

    - name: Copy Swagger UI pages into published site
      run: |
        mkdir -p ./build/swagger
        cp -R ../docs/. ./build/swagger/

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./documentation/build
        keep_files: false
